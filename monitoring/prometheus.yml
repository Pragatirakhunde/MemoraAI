global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: memora-api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:8000/api/v1/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: memora-frontend
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:5173/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: memora-dependencies
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["host.docker.internal:5433"]
        labels:
          service: PostgreSQL
      - targets: ["host.docker.internal:7687"]
        labels:
          service: Neo4j
      - targets: ["host.docker.internal:6333"]
        labels:
          service: Qdrant
      - targets: ["host.docker.internal:6379"]
        labels:
          service: Redis
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
